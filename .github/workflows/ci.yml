name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes; past 25 something is stuck, so stop instead of holding
    # the runner for 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Root build, as deployed to Cloudflare Pages (https://verseorder.watch).
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:scripts
      # Browsers are cached per Playwright version and OS; on a miss the download takes ~10s.
      # No --with-deps / install-deps: ubuntu-latest already has Chromium's libraries (apt only
      # adds fonts and upgrades), and that apt step is what took 11-13 minutes on slow mirrors.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Includes tests/redirect.spec.ts, which builds and checks the GitHub Pages redirect stubs.
      - run: npm run test:e2e
