name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes. The apt part of the Playwright install has taken 13 on a
    # slow mirror; past 25 something is stuck, so stop instead of holding the runner for 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Root build, as deployed to Cloudflare Pages (https://verseorder.watch).
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      # Includes tests/redirect.spec.ts, which builds and checks the GitHub Pages redirect stubs.
      - run: npm run test:e2e
