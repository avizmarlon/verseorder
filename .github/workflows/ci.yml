name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Root build, as deployed to Cloudflare Pages (https://verseorder.watch).
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Includes tests/redirect.spec.ts, which builds and checks the GitHub Pages redirect stubs.
      - run: npm run test:e2e
