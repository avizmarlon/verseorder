name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          GITHUB_PAGES: "true"
