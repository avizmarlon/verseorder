name: Cloudflare Pages build
# Builds and tests exactly what gets deployed to Cloudflare Pages. It does not deploy: deploys run
# from the maintainer's machine with `npm run deploy:cloudflare`, because the card trailer clips
# are not in this repository and a deploy without them would remove them from the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Cloudflare Pages limits (25 MiB per file, 20,000 files)
        run: node scripts/prepare-cloudflare.mjs
