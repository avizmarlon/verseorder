name: Cloudflare Pages build
# Builds and tests exactly what gets deployed to Cloudflare Pages. It does not deploy: deploys run
# from the maintainer's machine with `npm run deploy:cloudflare`. The card trailer clips live in R2
# (media.verseorder.watch), not in this repository or the Pages deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes; past 25 something is stuck, so stop instead of holding
    # the runner for 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      # Browsers are cached per Playwright version and OS; on a miss the download takes ~10s.
      # No --with-deps / install-deps: ubuntu-latest already has Chromium's libraries (apt only
      # adds fonts and upgrades), and that apt step is what took 11-13 minutes on slow mirrors.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Check Cloudflare Pages limits (25 MiB per file, 20,000 files)
        run: node scripts/prepare-cloudflare.mjs
