name: Cloudflare Pages build
# Builds and tests exactly what gets deployed to Cloudflare Pages. It does not deploy: deploys run
# from the maintainer's machine with `npm run deploy:cloudflare`. The card trailer clips live in R2
# (media.verseorder.watch), not in this repository or the Pages deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes. The apt part of the Playwright install has taken 13 on a
    # slow mirror; past 25 something is stuck, so stop instead of holding the runner for 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Cloudflare Pages limits (25 MiB per file, 20,000 files)
        run: node scripts/prepare-cloudflare.mjs
