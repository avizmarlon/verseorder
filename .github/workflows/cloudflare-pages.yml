name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://verseorder.watch/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare deploy skipped::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The site will be built and tested but not deployed."
          fi
      - run: npm ci
      - name: Fetch card trailer clips
        if: vars.CLIPS_RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPS_RELEASE: ${{ vars.CLIPS_RELEASE }}
        run: |
          mkdir -p public/clips
          gh release download "$CLIPS_RELEASE" --repo "$GITHUB_REPOSITORY" --dir public/clips --pattern '*.mp4' --pattern '*.webm' --clobber
          ls -la public/clips
      - name: No clips configured
        if: vars.CLIPS_RELEASE == ''
        run: echo "::notice::CLIPS_RELEASE is not set; deploying without card trailer clips (cards show static banners)."
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Cloudflare Pages limits (25 MiB per file, 20,000 files)
        run: |
          big=$(find out -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::Files over 25 MiB: $big"; exit 1; fi
          count=$(find out -type f | wc -l)
          echo "Files in out/: $count"
          if [ "$count" -gt 20000 ]; then echo "::error::Too many files for Cloudflare Pages: $count"; exit 1; fi
      - name: Deploy
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=verseorder --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
