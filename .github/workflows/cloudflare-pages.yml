name: Cloudflare Pages build
# Builds and tests exactly what gets deployed to Cloudflare Pages. It does not deploy: deploys run
# from the maintainer's machine with `npm run deploy:cloudflare`, because the card trailer clips
# are not in this repository and a deploy without them would remove them from the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Cloudflare Pages limits (25 MiB per file, 20,000 files)
        run: |
          big=$(find out -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::Files over 25 MiB: $big"; exit 1; fi
          count=$(find out -type f | wc -l)
          echo "Files in out/: $count"
          if [ "$count" -gt 20000 ]; then echo "::error::Too many files for Cloudflare Pages: $count"; exit 1; fi
