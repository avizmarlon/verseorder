name: GitHub Pages
# avizmarlon.github.io/verseorder/ is being retired in favour of https://verseorder.watch.
# Set the repository variable GITHUB_PAGES_REDIRECT=true once the new domain is live: every path
# then becomes a small redirect stub to the same path on the new domain. Until then this keeps
# publishing the full site under /verseorder so nothing breaks during the move.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build redirect stubs
        if: vars.GITHUB_PAGES_REDIRECT == 'true'
        run: |
          npm run build
          node scripts/build-redirect.mjs --from out --to site
      - name: Build legacy project-page site
        if: vars.GITHUB_PAGES_REDIRECT != 'true'
        env:
          GITHUB_PAGES: "true"
          # Keep canonical URLs on github.io until the new domain is live.
          SITE_URL: https://avizmarlon.github.io/verseorder/
        run: |
          npm run build
          mv out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
